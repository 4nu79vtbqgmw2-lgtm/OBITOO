  position:relative;
}
.avatar{position:relative;width:145px;height:145px;margin:-100px auto 0}
.avatar::before{
  content:""; position:absolute; inset:-6px; border-radius:50%;
  background:conic-gradient(from 0deg,#087cff,#ff174f,#087cff,#ff003c,#087cff);
  box-shadow:0 0 24px rgba(8,124,255,.55),0 0 28px rgba(255,23,79,.42);
  animation:spin 5s linear infinite;
}
.avatar::after{
  content:""; position:absolute; inset:-14px; border-radius:50%;
  border:1px solid rgba(8,124,255,.28);
  box-shadow:0 0 28px rgba(8,124,255,.18),0 0 20px rgba(255,23,79,.14);
}
.avatar img{
  position:relative;z-index:2;width:100%;height:100%;padding:5px;
  object-fit:cover;border-radius:50%;background:#050505;display:block;
}
@keyframes spin{to{transform:rotate(360deg)}}
h1{
  margin-top:42px;font-size:42px;font-weight:900;letter-spacing:6px;
  background:linear-gradient(90deg,#fff,#087cff,#fff,#ff174f,#fff);
  background-size:300%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:nameMove 5s linear infinite;
  text-shadow:0 0 24px rgba(8,124,255,.12);
}
@keyframes nameMove{from{background-position:0%}to{background-position:300%}}
.bio{margin-top:8px;color:rgba(255,255,255,.62);font-size:14px}
.line{
  width:90px;height:3px;margin:22px auto;border-radius:20px;
  background:linear-gradient(90deg,var(--blue),var(--red));
  box-shadow:0 0 12px rgba(255,23,79,.45);
}
.links{display:flex;flex-direction:column;gap:14px}
.link{
  display:flex;align-items:center;width:100%;min-height:68px;padding:10px 15px;
  text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.13);
  border-radius:18px;transition:.3s ease;overflow:hidden;
}
.link:hover{transform:translateY(-4px)}
.icon{
  width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;margin-right:14px;border-radius:14px;font-size:23px;
}
.quran{background:linear-gradient(135deg,rgba(50,220,150,.24),rgba(8,124,255,.16))}
.quran .icon{color:#4de0a6;background:rgba(50,220,150,.12);border:1px solid rgba(50,220,150,.2)}
.quran:hover{border-color:rgba(50,220,150,.65);box-shadow:0 10px 30px rgba(50,220,150,.14)}
.discord{background:linear-gradient(135deg,rgba(88,101,242,.28),rgba(8,124,255,.14))}
.discord .icon{color:var(--discord);background:rgba(88,101,242,.13);border:1px solid rgba(88,101,242,.25)}
.discord:hover{border-color:rgba(88,101,242,.72);box-shadow:0 10px 30px rgba(88,101,242,.2)}
.text{text-align:left}
.title{display:block;font-size:17px;font-weight:bold}
.description{display:block;margin-top:4px;color:rgba(255,255,255,.46);font-size:12px}
.arrow{margin-left:auto;color:rgba(255,255,255,.35);transition:.3s}
.link:hover .arrow{color:#fff;transform:translateX(5px)}
.status{
  display:inline-flex;align-items:center;gap:7px;margin-top:21px;padding:7px 13px;
  border-radius:50px;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:11px;
}
.dot{width:7px;height:7px;border-radius:50%;background:#35e39a;box-shadow:0 0 10px #35e39a}
footer{margin-top:18px;color:rgba(255,255,255,.28);font-size:10px;letter-spacing:2px}
@media(max-width:500px){
  body{padding:12px} .card{padding:34px 17px 24px;border-radius:25px}
  .avatar{width:120px;height:120px;margin:-82px auto 0}
  h1{font-size:32px;letter-spacing:5px}
}
</style>
</head>
